name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  invariants:
    name: Plugin invariants
    runs-on: ubuntu-latest
    steps:
      # persist-credentials: false on every checkout — nothing here needs git
      # auth after the clone, and a stored token can leak via artifacts.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # The behavioral leg needs the claude CLI and API access, so it is skipped
      # here; SKIP_BEHAVIORAL keeps the static invariants running.
      - name: Run static invariants
        env:
          SKIP_BEHAVIORAL: "1"
        run: bash tests/skill-collision-repro.sh

  generated:
    name: Generated files current
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: "1.3.14"
      # The generator stamps VERSION into the manifests and validates the Codex
      # marketplace pointer. A dirty tree afterwards means a committed copy is
      # stale (e.g. VERSION bumped without regenerating).
      - name: Regenerate and assert clean tree
        run: |
          bun tools/generate.mjs
          git diff --exit-code
      - name: Sync-tool fixture tests
        run: bun test tests/

  scripts:
    name: Vendored bun tooling
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: plugins/pstack/skills/poteto-mode/scripts
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          # Match the version the invariants were last verified against locally.
          bun-version: "1.3.14"
      - name: Install dependencies
        run: bun install --frozen-lockfile
      - name: Typecheck
        run: bun run typecheck
      - name: Test
        run: bun test orch watch-pr

  shellcheck:
    name: Shell scripts
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # Select by extension OR shebang. The hook scripts are deliberately
      # extensionless (Claude Code's Windows auto-detection prepends "bash" to
      # any command containing ".sh"), so an extension-only glob skipped the
      # one script that runs at every user's session start.
      - name: Run shellcheck
        run: |
          shellcheck --version
          {
            find . -path ./.git -prune -o -path '*/node_modules' -prune -o -name '*.sh' -print
            grep -rlE --exclude-dir=.git --exclude-dir=node_modules '^#!/(usr/bin/env )?(ba)?sh' .
          } | sed 's#^\./##' | sort -u | tee /dev/stderr | xargs shellcheck --severity=warning
