name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  generated:
    name: Generated files current
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: "1.4.4"
      - name: Install dependencies
        run: bun install --frozen-lockfile
      - name: Check generated files and plugin invariants
        run: bun tools/generate.mjs --check
      - name: Tool and invariant fixture tests
        run: bun test tests/

  windows-hooks:
    name: Windows session hooks
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: "1.4.4"
      - name: Install dependencies
        run: bun install --frozen-lockfile
      - name: Test Windows session hooks
        run: bun test --timeout 10000 tests/session-hook-windows.test.mjs
        env:
          PSTACK_REQUIRE_WINDOWS_HOOK: "1"

  windows-worktree-audit:
    name: Windows worktree audit
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: "1.4.4"
      - name: Install dependencies
        run: bun install --frozen-lockfile
      - name: Test the worktree audit
        run: bun test --timeout 30000 tests/worktree-audit.test.mjs

  forks:
    name: Fork registry
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: "1.4.4"
      - name: Install dependencies
        run: bun install --frozen-lockfile
      # A dry-run sync to the SHA already pinned compares the port with
      # upstream as it stands, and fails on a fork tools/forks.json lacks or
      # an entry whose path is not forked. bash ignores the exit status of a
      # process substitution, so jq fills a variable first. Fed straight to
      # the loop, a jq error runs it zero times and the step passes.
      - name: Check every fork from upstream is declared
        run: |
          set -eo pipefail
          components=$(jq -r '.components | to_entries[] | "\(.key) \(.value.sha)"' tools/upstream.json)
          if [ -z "$components" ]; then
            echo "tools/upstream.json lists no components"
            exit 1
          fi
          failed=0
          while read -r component sha; do
            bun tools/sync.mjs "$component" "$sha" --dry-run | tee "$RUNNER_TEMP/sync-$component.txt" || failed=1
          done <<< "$components"
          exit "$failed"
      # Rules are shared by every component, so one run checks them all.
      - name: Check every substitution rule matches upstream at the pins
        if: ${{ !cancelled() }}
        run: bun tools/sync.mjs --check-rules
      # Annotates rather than fails: generated edits and declared forks are
      # legitimate, but a reviewer should see every upstream skill file a PR
      # touches. A port-only file, from the dry runs above, has no upstream.
      - name: Warn on upstream skill files the pull request changes
        if: ${{ !cancelled() && github.event_name == 'pull_request' }}
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          git fetch --depth=1 origin "$BASE_SHA"
          declare -A forks port_only
          while IFS= read -r path; do forks[$path]=1; done < <(jq -r '.[] | keys[]' tools/forks.json)
          while IFS= read -r path; do port_only[$path]=1; done < <(
            awk '/^port-only: / { listed = 1; next } listed && /^  / { print $1; next } { listed = 0 }' "$RUNNER_TEMP"/sync-*.txt
          )
          git diff --name-only "$BASE_SHA" HEAD -- plugins/pstack/skills |
            while IFS= read -r path; do
              if [[ -v forks[$path] ]]; then
                echo "::warning file=$path::Declared fork changed. Update its why in tools/forks.json if the edit changes what the fork does."
              elif [[ ! -v port_only[$path] ]]; then
                echo "::warning file=$path::Upstream skill file changed. An edit that departs from upstream needs an entry in tools/forks.json."
              fi
            done

  skills-only:
    name: Skills-only install
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # Installs this checkout rather than the GitHub URL, so the canary proves
      # the tree in the PR instead of whatever is on main. One agent target is
      # enough: the CLI copies the same bytes for every agent, and the
      # generated job already validated the source tree's links and prose.
      - name: Install the skills tree with the skills CLI
        run: |
          npx --yes skills@1.5.23 add ./plugins/pstack/skills \
            --skill '*' --agent codex --yes --copy
      - name: Compare the installed skills tree with the source
        run: diff -qr plugins/pstack/skills .agents/skills

  pi-types:
    name: Pi extension types
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: "1.4.4"
      # The extension's types and model catalog come from the installed Pi
      # package, so the checks run against the release users have rather than
      # a copy in bun.lock. No lockfile: the exact version is pinned, and
      # --before holds Pi's dependencies to the versions published by that
      # date, since Pi releases after 1.0.0 ship no npm-shrinkwrap.json. Move
      # the date with the version. The job has read-only permissions and no
      # secrets. A lockfile here would put Pi's whole dependency tree under
      # this repository's dependency scans.
      - name: Install Pi
        run: npm install -g --ignore-scripts --before=2026-10-11 @earendil-works/pi-coding-agent@1.1.0 # zizmor: ignore[adhoc-packages]
      - name: Typecheck the extension against Pi
        run: bun tools/typecheck-pi.mjs
      - name: Install test dependencies
        run: bun install --frozen-lockfile
      # These checks make no model calls. Missing Pi fails instead of skipping.
      - name: Check the model catalog and child startup against Pi
        run: bun test tests/pi/catalog.test.mjs tests/pi/runtime.test.mjs
        env:
          PSTACK_PI_REQUIRE_CATALOG: "1"
          PSTACK_PI_REQUIRE_RUNTIME: "1"

  scripts:
    name: Vendored bun tooling
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: plugins/pstack/skills/poteto-mode/scripts
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: "1.4.4"
      - name: Install dependencies
        run: bun install --frozen-lockfile
      - name: Typecheck
        run: bun run typecheck
      - name: Test
        run: bun test orch watch-pr check-plan.test.ts
      # Pinned here, not in package.json, so bun.lock stays identical to
      # upstream's. 3.6.2 reproduces upstream's watch-pr files byte for byte,
      # except fakes.test-helper.ts and github.test.ts, which .prettierignore
      # lists; later releases rewrap types.ts too.
      - name: Check formatting
        run: bunx prettier@3.6.2 --check .

  statechart:
    name: Statechart scripts
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: plugins/pstack/skills/statechart/scripts
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # The Node the suite was measured on. It runs the TypeScript sources
      # directly, which needs Node 22.18, or 23.6 and later.
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24.22.1"
          package-manager-cache: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: "1.4.4"
      - name: Install dependencies
        run: bun install --frozen-lockfile
      # TLC_TOOL in run.ts pins the release and checksum the skill installs
      # with mise, so the job checks the same jar.
      - name: Download TLC
        env:
          TLA2TOOLS: ${{ runner.temp }}/tla2tools.jar
        run: |
          set -eo pipefail
          pin=$(node -e 'const [, sum, version] = require("fs").readFileSync("run.ts", "utf8").match(/const TLC_TOOL =\s*"[^"]*sha256:([0-9a-f]{64})\]@([^"]+)"/); console.log(version, sum);')
          read -r version sum <<< "$pin"
          curl --fail --location --output "$TLA2TOOLS" "https://github.com/tlaplus/tlaplus/releases/download/v$version/tla2tools.jar"
          echo "$sum  $TLA2TOOLS" | sha256sum --check
      # The render tests install Pele and Mermaid with npm under XDG_CACHE_HOME.
      # The watchdog dumps every Node process's stack when the suite runs past
      # 12 minutes, twice the 260 to 391 s that 24 runner runs took, and well
      # inside the job limit above.
      - name: Test
        env:
          TLA2TOOLS: ${{ runner.temp }}/tla2tools.jar
          XDG_CACHE_HOME: ${{ runner.temp }}/xdg
          WATCHDOG_REPORTS: ${{ runner.temp }}/reports
        run: JAVA="$(command -v java)" bash "$GITHUB_WORKSPACE/.github/scripts/statechart-watchdog.sh"

  shellcheck:
    name: Shell scripts
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Run shellcheck
        run: |
          shellcheck --version
          find . -path ./.git -prune -o -path '*/node_modules' -prune -o -name '*.sh' -print |
            sed 's#^\./##' | sort | tee /dev/stderr | xargs shellcheck --severity=warning

  actionlint:
    name: Workflow lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # This job and the two below reach for their tool through docker or npx
      # because allowed_actions permits only GitHub-owned actions, verified
      # creators, oven-sh/setup-bun and zizmorcore/zizmor-action.
      #
      # The 1.7.12 tag is mutable, so the digest is what actually pins this.
      # Resolved with: docker buildx imagetools inspect rhysd/actionlint:1.7.12
      - name: Run actionlint
        run: |
          docker run --rm -v "$GITHUB_WORKSPACE:/repo" -w /repo \
            rhysd/actionlint:1.7.12@sha256:b1934ee5f1c509618f2508e6eb47ee0d3520686341fec936f3b79331f9315667 \
            -no-color

  markdownlint:
    name: Markdown lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # Rule selection and the reasoning behind it live in
      # .markdownlint-cli2.jsonc, which the tool picks up from the repo root.
      - name: Run markdownlint
        run: npx --yes markdownlint-cli2@0.18.1 '**/*.md'

  links:
    name: Markdown links
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # --offline resolves relative file and fragment targets and skips every
      # remote URL, so a contributor's PR never fails on someone else's link
      # rot. tools/validate-skills.mjs already covers the skills tree; this
      # reaches the README, CHANGES, CONTRIBUTING and the other top-level docs.
      #
      # Resolved with: docker buildx imagetools inspect lycheeverse/lychee:0.24.2
      - name: Check relative links and fragments
        run: |
          docker run --rm -v "$GITHUB_WORKSPACE:/repo" -w /repo \
            lycheeverse/lychee:0.24.2@sha256:e2d19e57cf6ab037026f20b8e449a1f30d9d7f81eef4194763aab2eab20bd28d \
            --offline --no-progress --include-fragments \
            --exclude-path node_modules --exclude-path .git '**/*.md'

  # macOS differs from ubuntu where the audit looks: BSD du pads its sizes and
  # the temp directory sits behind the /var link.
  macos-worktree-audit:
    name: macOS worktree audit
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: "1.4.4"
      - name: Install dependencies
        run: bun install --frozen-lockfile
      - name: Test the worktree audit
        run: bun test --timeout 30000 tests/worktree-audit.test.mjs
